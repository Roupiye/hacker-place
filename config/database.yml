default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  username: postgres
  password: postgres

development:
  primary: &primary_development
    <<: *default
    database: hacker_place_development
  queue:
    <<: *primary_development
    database: hacker_place_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: hacker_place_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    database: hacker_place_production
  queue:
    <<: *primary_production
    database: hacker_place_production_queue
    migrations_paths: db/queue_migrate
